site_name: Fluent Bit for Mere Mortals
site_description: Collect log lines where they are written, parse and shape them as they flow past, and forward them onward. Pipelines, parsers, filters, routing by tag, buffering and retries, and an honest account of what a forwarder does not store or answer.
