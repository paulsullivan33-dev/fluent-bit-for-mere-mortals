[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name    dummy
    Tag     app.web
    Dummy   {"message":"web request","tier":"web"}
    Rate    1
    Samples 2

[INPUT]
    Name    dummy
    Tag     app.worker
    Dummy   {"message":"background job","tier":"worker"}
    Rate    1
    Samples 3

[OUTPUT]
    Name   file
    Match  app.web
    Path   ../outputs
    File   t07-web.log

[OUTPUT]
    Name   file
    Match  app.worker
    Path   ../outputs
    File   t07-worker.log
