[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              ../fixtures/app-plain.log
    Tag               app.plain
    DB                ../outputs/t04.db
    DB.Sync           Full
    Refresh_Interval  1
    Skip_Long_Lines   On
    Inotify_Watcher   false
    Read_From_Head    true

[FILTER]
    Name          parser
    Match         app.plain
    Key_Name      log
    Parser        plain_parser
    Preserve_Key  On
    Reserve_Data  On

[OUTPUT]
    Name   stdout
    Match  app.plain
