[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf
    Storage.Path ../outputs/fsbuffer

[INPUT]
    Name    dummy
    Tag     test.buffer
    Dummy   {"message":"buffered while the endpoint is down","service":"ticket-desk"}
    Rate    1
    Samples 2
    storage.type filesystem

[OUTPUT]
    Name          http
    Match         test.buffer
    Host          127.0.0.1
    Port          19084
    URI           /ingest
    Format        json_lines
    Retry_Limit   5
    storage.type  filesystem
