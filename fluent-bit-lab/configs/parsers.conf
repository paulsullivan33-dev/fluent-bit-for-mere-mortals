[PARSER]
    Name        json_parser
    Format      json
    Time_Key    ts
    Time_Format %Y-%m-%dT%H:%M:%SZ

[PARSER]
    Name        plain_parser
    Format      regex
    Regex       ^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) (?<level>[A-Z]+) (?<service>\S+) ticket=(?<ticket>\d+) (?<message>.*)$
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S

[MULTILINE_PARSER]
    Name          stack_multiline
    Type          regex
    Flush_Timeout 1000
    Rule          "start_state"   "/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/"  "cont"
    Rule          "cont"          "/^(?!\d{4}-\d{2}-\d{2})/"               "cont"
