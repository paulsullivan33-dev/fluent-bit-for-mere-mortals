[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              ../fixtures/stacktrace.log
    Tag               app.stack
    Refresh_Interval  1
    Inotify_Watcher   false
    Read_From_Head    true
    Multiline         On
    Multiline_Flush   1

[OUTPUT]
    Name   stdout
    Match  app.stack
