[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf
    HTTP_Server  On
    HTTP_Listen  127.0.0.1
    HTTP_Port    19084

[INPUT]
    Name   http
    Listen 127.0.0.1
    Port   18084
    Tag    http.test

[OUTPUT]
    Name   file
    Match  http.test
    Path   ../outputs
    File   t06-http.log
