[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              ../fixtures/stacktrace.log
    Tag               app.stack
    DB                ../outputs/t05.db
    DB.Sync           Full
    Refresh_Interval  1
    Skip_Long_Lines   On
    Inotify_Watcher   false
    Read_From_Head    true
    Multiline.Parser  stack_multiline

[OUTPUT]
    Name   stdout
    Match  app.stack
