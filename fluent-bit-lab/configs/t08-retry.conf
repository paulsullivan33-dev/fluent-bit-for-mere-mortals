[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name    dummy
    Tag     test.retry
    Dummy   {"message":"needs a home that is not listening","service":"ticket-desk"}
    Rate    1
    Samples 2

[OUTPUT]
    Name        http
    Match       test.retry
    Host        127.0.0.1
    Port        19084
    URI         /ingest
    Format      json_lines
    Retry_Limit 3
