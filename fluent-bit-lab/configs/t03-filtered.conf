[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              ../fixtures/app.log
    Tag               app.json
    DB                ../outputs/t03.db
    DB.Sync           Full
    Refresh_Interval  1
    Skip_Long_Lines   On
    Inotify_Watcher   false
    Read_From_Head    true

[FILTER]
    Name          parser
    Match         app.json
    Key_Name      log
    Parser        json_parser
    Preserve_Key  Off
    Reserve_Data  On

[FILTER]
    Name    modify
    Match   app.json
    Add     pipeline fluent-bit-lab
    Rename  message event

[FILTER]
    Name    grep
    Match   app.json
    Exclude $level DEBUG

[OUTPUT]
    Name   file
    Match  app.json
    Path   ../outputs
    File   t03-filtered.log
